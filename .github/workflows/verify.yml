name: VibeOS verification

on:
  push:
    branches:
      - main
      - 'vibeos-codespace'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-aarch64 gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu make
      - name: Build disk image and build
        run: |
          make disk || true
          make -j$(nproc)
      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vibeos-build
          path: |
            disk.img
            build/**
            user/bin/**
